<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>メーカーページ作成 - 架空車街</title>
<!-- Moveable: ドラッグ・リサイズ・回転ライブラリ -->
<script src="https://daybrush.com/moveable/release/latest/dist/moveable.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; background: #0a0c1b; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.screen { display: none; height: 100%; flex-direction: column; }
.screen.active { display: flex; }
#login-screen, #not-maker-screen { align-items: center; justify-content: center; padding: 20px; }
.login-box, .not-maker-box { background: #16213e; padding: 40px 30px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; }
.login-box { border: 1px solid #00d2ff; }
.login-box h1 { color: #00d2ff; margin: 0 0 20px; }
.not-maker-box { border: 1px solid #e94560; }
.not-maker-box h2 { color: #e94560; margin: 0 0 16px; }

.toolbar { background: #16213e; border-bottom: 1px solid #2a2a4a; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.toolbar .brand { font-weight: bold; color: #00d2ff; margin-right: 8px; }
.toolbar input { padding: 6px 10px; background: #0a0c1b; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit; min-width: 150px; }
.toolbar input.valid { border-color: #4caf50; }
.toolbar input.invalid { border-color: #e94560; }

button.btn { padding: 8px 16px; background: #00d2ff; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.9rem; touch-action: manipulation; text-decoration: none; display: inline-block; }
button.btn:hover { background: #00a2c7; }
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
button.btn-secondary { background: #444; color: #fff; }
button.btn-secondary:hover { background: #555; }
button.btn-danger { background: #e94560; color: #fff; }
button.btn-danger:hover { background: #c73050; }

.mode-tabs { display: flex; background: #0a0c1b; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; }
.mode-tabs button { flex: 1; padding: 10px; background: transparent; color: #888; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
.mode-tabs button.active { color: #00d2ff; border-bottom-color: #00d2ff; background: rgba(0,210,255,0.05); }
.mode-tabs button:disabled { opacity: 0.4; cursor: not-allowed; }

.editor-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ===== 手動モード ===== */
.manual-container { display: flex; width: 100%; height: 100%; }
.manual-input { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.manual-input textarea { flex: 1; width: 100%; padding: 16px; background: #0a0c1b; color: #e0e0e0; border: none; resize: none; font-family: 'SF Mono', Consolas, monospace; font-size: 13px; line-height: 1.6; outline: none; min-height: 0; }
.manual-preview { flex: 1; min-width: 0; background: #fff; border-left: 1px solid #2a2a4a; }
.manual-preview iframe { width: 100%; height: 100%; border: none; display: block; }

/* ===== GUIモード ===== */
.gui-container { display: flex; width: 100%; height: 100%; }
.gui-palette { width: 180px; flex-shrink: 0; background: #16213e; border-right: 1px solid #2a2a4a; overflow-y: auto; padding: 12px; }
.gui-palette h4 { margin: 0 0 12px; font-size: 0.85rem; color: #00d2ff; }
.gui-palette button { display: block; width: 100%; margin-bottom: 8px; padding: 10px; background: #0a0c1b; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-family: inherit; font-size: 0.85rem; cursor: pointer; text-align: left; transition: 0.15s; }
.gui-palette button:hover { border-color: #00d2ff; background: rgba(0,210,255,0.08); color: #00d2ff; }
.gui-palette button .icon { margin-right: 6px; }

.gui-canvas-wrapper { flex: 1; min-width: 0; overflow: auto; background: #2a2a4a; padding: 24px; display: flex; justify-content: center; align-items: flex-start; }
.gui-canvas { position: relative; width: 100%; max-width: 1000px; min-height: 800px; background: #fff; border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); overflow: hidden; }

.gui-component { position: absolute; box-sizing: border-box; overflow: hidden; cursor: grab; }
.gui-component:active { cursor: grabbing; }
.gui-component[contenteditable="true"]:focus { outline: 2px solid #00d2ff; outline-offset: -2px; }
.gui-component img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gui-component.selected { outline: 2px solid #00d2ff; outline-offset: -2px; }

.gui-properties { width: 220px; flex-shrink: 0; background: #16213e; border-left: 1px solid #2a2a4a; overflow-y: auto; padding: 12px; }
.gui-properties h4 { margin: 0 0 12px; font-size: 0.85rem; color: #00d2ff; }
.gui-properties .form-group { margin-bottom: 12px; }
.gui-properties label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
.gui-properties input[type="number"], .gui-properties input[type="text"], .gui-properties select { width: 100%; padding: 6px 8px; background: #0a0c1b; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit; font-size: 0.85rem; }
.gui-properties input[type="color"] { width: 100%; height: 32px; border: 1px solid #333; border-radius: 4px; background: #0a0c1b; cursor: pointer; }
.gui-properties .no-selection { color: #666; font-size: 0.85rem; text-align: center; padding: 20px 0; }

.mobile-tabs { display: none; background: #0a0c1b; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; }
.mobile-tabs button { flex: 1; padding: 10px; background: transparent; color: #888; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; }
.mobile-tabs button.active { color: #00d2ff; border-bottom-color: #00d2ff; }

@media (max-width: 900px) {
  .gui-palette { width: 120px; padding: 8px; }
  .gui-palette button { font-size: 0.75rem; padding: 8px; }
  .gui-properties { width: 180px; padding: 8px; }
}
@media (max-width: 768px) {
  .toolbar { padding: 6px 8px; gap: 6px; }
  .toolbar input { min-width: 100px; }
  .toolbar .btn { padding: 6px 10px; font-size: 0.8rem; }
  .manual-container { flex-direction: column; }
  .manual-preview { border-left: none; border-top: 1px solid #2a2a4a; }
  .manual-input.hidden-on-mobile, .manual-preview.hidden-on-mobile { display: none; }
  .mobile-tabs { display: flex; }
  .gui-container { flex-direction: column; }
  .gui-palette { width: 100%; display: flex; overflow-x: auto; gap: 6px; padding: 8px; border-right: none; border-bottom: 1px solid #2a2a4a; }
  .gui-palette h4 { display: none; }
  .gui-palette button { width: auto; white-space: nowrap; margin-bottom: 0; }
  .gui-properties { width: 100%; border-left: none; border-top: 1px solid #2a2a4a; max-height: 200px; }
}

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #16213e; border: 1px solid #00d2ff; border-radius: 8px; padding: 24px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal-content h3 { margin: 0 0 16px; color: #00d2ff; }

.drop-zone { border: 2px dashed #444; border-radius: 8px; padding: 40px 20px; text-align: center; color: #888; cursor: pointer; transition: all 0.2s; }
.drop-zone:hover, .drop-zone.dragover { border-color: #00d2ff; background: rgba(0,210,255,0.05); color: #00d2ff; }
.drop-zone input[type=file] { display: none; }
.upload-list { margin-top: 16px; }
.upload-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: #0a0c1b; border-radius: 4px; margin-bottom: 8px; font-size: 0.85rem; }
.upload-item .status { color: #888; }
.upload-item.done .status { color: #4caf50; }
.upload-item.error .status { color: #e94560; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #16213e; color: #fff; padding: 12px 24px; border-radius: 8px; border: 1px solid #00d2ff; z-index: 2000; transition: transform 0.3s; max-width: 90%; font-size: 0.9rem; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.error { border-color: #e94560; }

.presets-list { display: grid; gap: 12px; }
.preset-item { padding: 16px; background: #0a0c1b; border: 1px solid #333; border-radius: 6px; cursor: pointer; transition: 0.2s; }
.preset-item:hover { border-color: #00d2ff; background: rgba(0,210,255,0.05); }
.preset-item strong { color: #00d2ff; display: block; margin-bottom: 4px; }
.preset-item span { font-size: 0.85rem; color: #aaa; }

.site-info { background: #16213e; padding: 8px 12px; font-size: 0.8rem; border-bottom: 1px solid #2a2a4a; color: #aaa; flex-shrink: 0; }
.site-info a { color: #00d2ff; }
.site-info .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin-left: 8px; }
.site-info .status-badge.published { background: #4caf50; color: #fff; }
.site-info .status-badge.draft { background: #ff9800; color: #000; }

.loader-overlay { position: fixed; inset: 0; background: rgba(10,12,27,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; }
.loader-overlay.active { display: flex; }
.loader-overlay .spinner { width: 60px; height: 60px; border: 4px solid #333; border-top-color: #00d2ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loader" class="loader-overlay"><div class="spinner"></div></div>

<!-- ===== ログイン画面 ===== -->
<div id="login-screen" class="screen">
  <div class="login-box">
    <h1>メーカーページ作成</h1>
    <p style="color:#aaa; margin-bottom:24px;">架空車街のメーカーアカウントでログインしてください</p>
    <button class="btn" id="login-google" style="width:100%; margin-bottom:10px;">Googleでログイン</button>
    <a href="https://cpmcarshop.github.io/" class="btn btn-secondary" style="width:100%;">架空車街に戻る</a>
  </div>
</div>

<!-- ===== メーカー未登録画面 ===== -->
<div id="not-maker-screen" class="screen">
  <div class="not-maker-box">
    <h2>メーカー登録が必要です</h2>
    <p style="color:#aaa; margin-bottom:20px;">
      メーカーページを作成するには、まず架空車街でメーカー登録を行ってください。
    </p>
    <a href="https://cpmcarshop.github.io/" class="btn" style="margin-bottom:10px; display:inline-block;">
      架空車街で登録する
    </a>
    <button class="btn btn-secondary" id="retry-maker-check" style="width:100%; margin-bottom:10px;">
      再チェック
    </button>
    <button class="btn btn-secondary" id="logout-from-notmaker" style="width:100%;">
      ログアウト
    </button>
    <p id="debug-uid" style="color:#666; font-size:0.7rem; margin-top:20px; word-break:break-all; white-space:pre-wrap; text-align:left;"></p>
  </div>
</div>

<!-- ===== エディタ画面 ===== -->
<div id="editor-screen" class="screen">
  <div class="toolbar">
    <span class="brand">メーカーページ</span>
    <input type="text" id="slug-input" placeholder="ページ名" maxlength="64">
    <button class="btn btn-secondary" id="slug-check-btn">確認</button>
    <button class="btn btn-secondary" id="preset-btn">📄 プリセット</button>
    <button class="btn" id="publish-btn">公開</button>
    <button class="btn btn-danger" id="delete-btn" style="display:none;">削除</button>
    <button class="btn btn-secondary" id="logout-btn" style="margin-left:auto;">ログアウト</button>
  </div>
  <div id="site-info-bar" class="site-info" style="display:none;"></div>

  <div class="mode-tabs" id="mode-tabs">
    <button data-mode="manual" class="active">手動（HTML）</button>
    <button data-mode="gui">GUI（簡単モード）</button>
  </div>

  <div class="mobile-tabs" id="mobile-tabs">
    <button data-pane="editor" class="active">✏️ 編集</button>
    <button data-pane="preview">👁 プレビュー</button>
  </div>

  <div class="editor-area">
    <!-- 手動モード -->
    <div id="manual-mode-container" class="manual-container">
      <div class="manual-input" id="pane-editor">
        <textarea id="html-editor" spellcheck="false"></textarea>
      </div>
      <div class="manual-preview" id="pane-preview">
        <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-popups"></iframe>
      </div>
    </div>

    <!-- GUIモード -->
    <div id="gui-mode-container" class="gui-container" style="display:none;">
      <div class="gui-palette">
        <h4>コンポーネント追加</h4>
        <button data-add="heading"><span class="icon">H</span>見出し</button>
        <button data-add="text"><span class="icon">T</span>テキスト</button>
        <button data-add="image"><span class="icon">🖼</span>画像</button>
        <button data-add="button"><span class="icon">🔘</span>ボタン</button>
        <button data-add="divider"><span class="icon">―</span>区切り線</button>
        <button data-add="spacer"><span class="icon">␣</span>スペーサー</button>
      </div>
      <div class="gui-canvas-wrapper" id="gui-canvas-wrapper">
        <div class="gui-canvas" id="gui-canvas"></div>
      </div>
      <div class="gui-properties" id="gui-properties">
        <h4>プロパティ</h4>
        <div id="gui-properties-content">
          <div class="no-selection">コンポーネントを選択してください</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 画像アップロードモーダル ===== -->
<div id="image-modal" class="modal">
  <div class="modal-content">
    <h3>画像をアップロード</h3>
    <p style="color:#888; font-size:0.85rem;">1枚10MBまで。GitHubリポジトリに保存されます。</p>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="image-input" accept="image/*" multiple>
      <div style="font-size:2rem; margin-bottom:8px;">🖼</div>
      <div>クリックまたはドロップで画像を選択</div>
    </div>
    <div class="upload-list" id="upload-list"></div>
    <div style="text-align:right; margin-top:16px;">
      <button class="btn btn-secondary" id="image-modal-close">閉じる</button>
    </div>
  </div>
</div>

<!-- ===== プリセットモーダル ===== -->
<div id="preset-modal" class="modal">
  <div class="modal-content">
    <h3>プリセット</h3>
    <p style="color:#888; font-size:0.85rem; margin-bottom:16px;">⚠️ 選択すると現在の内容が置き換わります。</p>
    <div class="presets-list" id="presets-list"></div>
    <div style="text-align:right; margin-top:16px;">
      <button class="btn btn-secondary" id="preset-modal-close">キャンセル</button>
    </div>
  </div>
</div>

<div id="toast"></div>

const app = initializeApp(firebaseConfig);

const state = {

// ============================================================
// ユーティリティ
// ============================================================
const $ = (id) => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  const target = $(name + '-screen');
  if (target) target.classList.add('active');
}
function showLoader() { $('loader').classList.add('active'); }
function hideLoader() { $('loader').classList.remove('active'); }

let toastTimer = null;
function toast(msg, isError = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = isError ? 'error show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function setDebug(msg) {
  const el = document.getElementById('debug-uid');
  if (el) el.textContent = msg;
  console.log('[debug]', msg);
}
function uuid() {
  return 'c_' + Math.random().toString(36).slice(2, 10);
}

// ============================================================
// API
// ============================================================
async function api(action, payload = {}) {
  if (!state.user) throw new Error('ログインしていません');
  const token = await state.user.getIdToken();
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ action, payload }),
  });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'APIエラー');
  return data.data;
}

// ============================================================
// localStorage
// ============================================================
function saveDraft() {
  try {
    if (state.mode === 'manual') {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ slug: state.slug, html: state.html, savedAt: Date.now() }));
    } else {
      localStorage.setItem(GUI_STORAGE_KEY, JSON.stringify({
        slug: state.slug,
        background: state.guiBackground,
        components: state.guiComponents,
        savedAt: Date.now()
      }));
    }
    state.isDirty = false;
  } catch (e) {}
}
function loadDraft() {
  try {
    if (state.mode === 'manual') {
      const r = localStorage.getItem(STORAGE_KEY);
      return r ? JSON.parse(r) : null;
    } else {
      const r = localStorage.getItem(GUI_STORAGE_KEY);
      return r ? JSON.parse(r) : null;
    }
  } catch (e) { return null; }
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  try { localStorage.removeItem(GUI_STORAGE_KEY); } catch (e) {}
}
function scheduleSave() {
  state.isDirty = true;
  clearTimeout(scheduleSave._t);
  scheduleSave._t = setTimeout(saveDraft, SAVE_DEBOUNCE);
}

  clearTimeout(previewTimer);

// ============================================================

function validateSlugLocal(slug) {
  if (!slug) return 'ページ名を入力してください';
  if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(slug)) return '英小文字・数字・-_ のみ、先頭は英数字、最大64文字';
  const reserved = ['cpmcarshop.github.io', 'makerpage', 'admin', 'api', 'www', 'assets', 'icons'];
  if (reserved.includes(slug)) return 'このページ名は使用できません';
  return null;
}

function renderSiteInfo() {
  const bar = $('site-info-bar');
  if (!state.site || !state.site.hasSite) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const s = state.site;
  const cls = s.published ? 'published' : 'draft';
  const txt = s.published ? '公開中' : '下書き（未公開）';
  bar.innerHTML = `ページ名: <strong>${escapeHtml(s.slug)}</strong><span class="status-badge ${cls}">${txt}</span>${s.published ? ` | <a href="${s.publicUrl}" target="_blank" rel="noopener">公開URL</a> | <a href="${s.previewUrl}" target="_blank" rel="noopener">直接表示</a>` : ''}`;
  $('delete-btn').style.display = 'inline-block';
}

// ============================================================
// 初期化（ログイン後）
// ============================================================
async function initAfterLogin(user) {
  showLoader();
  try {
    let makerInfo;
    try {
      makerInfo = await api('getMyMakerInfo');
    } catch (e) {
      setDebug('Your UID: ' + user.uid + '\nエラー: ' + e.message);
      showScreen('not-maker');
      return;
    }

    const maker = makerInfo && makerInfo.maker;
    if (!maker) {
      const d = (makerInfo && makerInfo.debug) || {};
      setDebug(
        'Your UID: ' + user.uid + '\n' +
        'mainWorkerStatus: ' + (d.mainWorkerStatus || '?') + '\n' +
        'mainWorkerRawBody: ' + (d.mainWorkerRawBody || '?') + '\n' +
        'makerFound: ' + (d.makerFound === true ? 'true' : (d.makerFound === false ? 'false' : '?')) + '\n' +
        'makerId: ' + (d.makerId || '-')
      );
      showScreen('not-maker');
      return;
    }

    state.maker = maker;

    try { state.site = await api('getMySite'); }
    catch (e) { state.site = { hasSite: false }; }

    if (state.site.hasSite) {
      state.slug = state.site.slug;
      $('slug-input').value = state.slug;
      $('slug-input').disabled = true;
      $('slug-input').classList.add('valid');
      // 既存サイトのモードを復元
      state.mode = state.site.mode === 'gui' ? 'gui' : 'manual';
    } else {
      state.mode = 'manual';
    }

    // ドラフト復元
    const draft = loadDraft();
    if (state.mode === 'manual') {
      state.html = (draft && draft.slug === state.slug) ? draft.html : PRESETS[0].html;
      $('html-editor').value = state.html;
      updatePreview();
    } else {
      if (draft && draft.slug === state.slug) {
        state.guiComponents = draft.components || [];
        state.guiBackground = draft.background || '#ffffff';
      } else {
        state.guiComponents = [];
        state.guiBackground = '#ffffff';
      }
      renderGuiCanvas();
    }

    // モードタブの状態を反映
    updateModeTabs();
    switchMode(state.mode, false);

    renderSiteInfo();
    showScreen('editor');
  } catch (e) {
    console.error('initAfterLogin error:', e);
    toast('初期化エラー: ' + e.message, true);
  } finally { hideLoader(); }
}

// ============================================================
// モード切替
// ============================================================
function updateModeTabs() {
  document.querySelectorAll('#mode-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
}

function switchMode(mode, save = true) {
  if (save && state.isDirty) {
    if (!confirm('保存されていない変更があります。モードを切り替えますか？')) return;
  }
  state.mode = mode;
  updateModeTabs();

  const manual = $('manual-mode-container');
  const gui = $('gui-mode-container');
  if (mode === 'manual') {
    manual.style.display = 'flex';
    gui.style.display = 'none';
    $('html-editor').value = state.html;
    updatePreview();
  } else {
    manual.style.display = 'none';
    gui.style.display = 'flex';
    renderGuiCanvas();
  }
}

$('mode-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn || btn.disabled) return;
  if (state.site && state.site.hasSite && state.site.mode !== state.mode) {
    toast('公開済みサイトのモードは変更できません', true);
    return;
  }
  switchMode(btn.dataset.mode);
});

// ============================================================
// GUIモード：キャンバス描画
// ============================================================
const canvas = $('gui-canvas');
let moveable = null;

function renderGuiCanvas() {
  if (!canvas) return;
  canvas.innerHTML = '';
  canvas.style.background = state.guiBackground || '#ffffff';
  canvas.style.minHeight = '800px';

  state.guiComponents.forEach(comp => {
    const el = document.createElement('div');
    el.className = 'gui-component';
    el.dataset.id = comp.id;
    el.style.left = comp.style.left + 'px';
    el.style.top = comp.style.top + 'px';
    el.style.width = comp.style.width + 'px';
    el.style.height = comp.style.height + 'px';
    el.style.background = comp.style.background || 'transparent';
    el.style.color = comp.style.color || '#333';
    el.style.fontSize = (comp.style.fontSize || 16) + 'px';
    el.style.borderRadius = (comp.style.borderRadius || 0) + 'px';
    el.style.textAlign = comp.style.textAlign || 'left';
    el.style.lineHeight = comp.style.lineHeight || 1.4;
    el.style.padding = '4px';
    el.style.boxSizing = 'border-box';
    el.style.overflow = 'hidden';
    el.style.display = 'flex';
    el.style.flexDirection = 'column';
    el.style.justifyContent = 'center';

    if (comp.type === 'heading' || comp.type === 'text') {
      el.contentEditable = 'true';
      el.innerText = comp.content || '';
      el.addEventListener('input', () => {
        comp.content = el.innerText;
        scheduleSave();
      });
    } else if (comp.type === 'image') {
      const img = document.createElement('img');
      img.src = comp.props.src || 'https://placehold.co/200x150?text=Image';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.borderRadius = 'inherit';
      el.appendChild(img);
      el.style.padding = '0';
      el.addEventListener('dblclick', () => {
        // 画像選択ダイアログ
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = () => {
          const file = input.files[0];
          if (!file) return;
          if (file.size > 10 * 1024 * 1024) { toast('10MBを超えています', true); return; }
          const reader = new FileReader();
          reader.onload = (ev) => {
            comp.props.src = ev.target.result;
            img.src = ev.target.result;
            scheduleSave();
          };
          reader.readAsDataURL(file);
        };
        input.click();
      });
    } else if (comp.type === 'button') {
      el.innerText = comp.content || 'ボタン';
      el.style.background = comp.style.background || '#00d2ff';
      el.style.color = comp.style.color || '#000';
      el.style.borderRadius = (comp.style.borderRadius || 4) + 'px';
      el.style.alignItems = 'center';
      el.style.textAlign = 'center';
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectComponent(comp.id);
      });
    } else if (comp.type === 'divider') {
      el.style.padding = '0';
      el.style.justifyContent = 'center';
      const hr = document.createElement('hr');
      hr.style.border = 'none';
      hr.style.borderTop = '2px solid #ccc';
      hr.style.width = '100%';
      hr.style.margin = '0';
      el.appendChild(hr);
    } else if (comp.type === 'spacer') {
      el.style.padding = '0';
      el.style.background = 'transparent';
    }

    // 選択状態の復元
    if (state.selectedId === comp.id) {
      el.classList.add('selected');
    }

    el.addEventListener('mousedown', (e) => {
      if (e.target === el || el.contains(e.target)) {
        selectComponent(comp.id);
      }
    });

    canvas.appendChild(el);
  });

  // Moveableの初期化（選択中の要素があればアタッチ）
  initMoveable();
// 修正後（render 引数を削除したので）
if (state.selectedId) {
  selectComponent(state.selectedId);
} else {
  deselectComponent();
}
}

// ============================================================
// Moveable 初期化
// ============================================================
function initMoveable() {
  if (!window.Moveable) {
    console.warn('Moveable not loaded');
    return;
  }
  if (moveable) {
    moveable.destroy();
    moveable = null;
  }
  moveable = new Moveable(document.body, {
    target: null,
    draggable: true,
    resizable: true,
    rotatable: false,
    keepRatio: false,
    snappable: true,
    bounds: { left: 0, top: 0, right: canvas.offsetWidth, bottom: canvas.offsetHeight },
    edge: false,
    origin: false,
  });

  moveable.on('drag', ({ target, left, top }) => {
    const id = target.dataset.id;
    const comp = state.guiComponents.find(c => c.id === id);
    if (comp) {
      comp.style.left = Math.round(left);
      comp.style.top = Math.round(top);
      target.style.left = comp.style.left + 'px';
      target.style.top = comp.style.top + 'px';
      scheduleSave();
    }
  });

  moveable.on('resize', ({ target, width, height, drag }) => {
    const id = target.dataset.id;
    const comp = state.guiComponents.find(c => c.id === id);
    if (comp) {
      comp.style.width = Math.round(width);
      comp.style.height = Math.round(height);
      comp.style.left = Math.round(drag.left);
      comp.style.top = Math.round(drag.top);
      target.style.width = comp.style.width + 'px';
      target.style.height = comp.style.height + 'px';
      target.style.left = comp.style.left + 'px';
      target.style.top = comp.style.top + 'px';
      scheduleSave();
    }
  });
}

// ============================================================
// コンポーネント選択
// ============================================================
function selectComponent(id) {
  // 前の選択を解除
  if (state.selectedId && state.selectedId !== id) {
    const prev = canvas.querySelector(`.gui-component[data-id="${state.selectedId}"]`);
    if (prev) prev.classList.remove('selected');
  }
  state.selectedId = id;

  const comp = state.guiComponents.find(c => c.id === id);
  if (!comp) { deselectComponent(); return; }

  const el = canvas.querySelector(`.gui-component[data-id="${id}"]`);
  if (!el) { deselectComponent(); return; }
  el.classList.add('selected');

  if (moveable) {
    moveable.target = el;
    moveable.updateRect();
  }
  renderProperties(comp);
}

function deselectComponent() {
  state.selectedId = null;
  if (moveable) moveable.target = null;
  renderProperties(null);
}

function toHex(color) {
  if (!color) return '#ffffff';
  if (color.startsWith('#')) return color.length === 4 ? '#' + color[1]+color[1]+color[2]+color[2]+color[3]+color[3] : color;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.fillStyle = color;
  return ctx.fillStyle;
}

// ============================================================
// GUI：コンポーネント追加
// ============================================================
function addComponent(type) {
  const id = uuid();
  let comp = {
    id,
    type,
    content: '',
    props: {},
    style: {
      left: 50,
      top: 50,
      width: 300,
      height: 60,
      background: 'transparent',
      color: '#333333',
      fontSize: 16,
      textAlign: 'left',
      borderRadius: 0,
      lineHeight: 1.4,
    }
  };

  if (type === 'heading') {
    comp.content = '見出しテキスト';
    comp.style.fontSize = 32;
    comp.style.height = 60;
  } else if (type === 'text') {
    comp.content = 'ここにテキストを入力してください。';
    comp.style.height = 80;
    comp.style.lineHeight = 1.7;
  } else if (type === 'image') {
    comp.props.src = 'https://placehold.co/300x200?text=Image';
    comp.style.width = 300;
    comp.style.height = 200;
    comp.style.padding = '0';
  } else if (type === 'button') {
    comp.content = 'ボタン';
    comp.props.href = '#';
    comp.style.background = '#00d2ff';
    comp.style.color = '#000000';
    comp.style.borderRadius = 4;
    comp.style.width = 160;
    comp.style.height = 48;
    comp.style.textAlign = 'center';
  } else if (type === 'divider') {
    comp.style.width = 400;
    comp.style.height = 10;
    comp.style.padding = '0';
  } else if (type === 'spacer') {
    comp.style.width = 200;
    comp.style.height = 40;
    comp.style.background = 'transparent';
    comp.style.padding = '0';
  }

  // 少しずつずらして重ならないように
  const count = state.guiComponents.length;
  comp.style.left = 50 + (count % 5) * 20;
  comp.style.top = 50 + (count % 5) * 20;

// 修正後（renderGuiCanvas の中で selectComponent が呼ばれるので削除）
state.guiComponents.push(comp);
state.selectedId = id;    // 事前にセット
scheduleSave();
renderGuiCanvas();
toast('コンポーネントを追加しました');
}

});

// ============================================================
// GUI：背景色
// ============================================================
function setGuiBackground(color) {
  state.guiBackground = color;
  canvas.style.background = color;
  scheduleSave();
}

// 背景色変更UIをプロパティパネルに常設（コンポーネント未選択時）
function renderProperties(comp) {
  const container = $('gui-properties-content');
  if (!comp) {
    container.innerHTML = `
      <div class="form-group">
        <label>キャンバス背景色</label>
        <input type="color" id="canvas-bg" value="${toHex(state.guiBackground)}">
      </div>
      <div class="no-selection">コンポーネントを選択してください</div>
    `;
    const bg = $('canvas-bg');
    if (bg) bg.addEventListener('input', () => {
      setGuiBackground(bg.value);
    });
    return;
  }

  let html = '';
  html += `<div class="form-group"><label>種類</label><div style="font-size:0.85rem;color:#aaa;">${escapeHtml(comp.type)}</div></div>`;

  html += `<div class="form-group"><label>幅 (px)</label><input type="number" id="prop-width" value="${comp.style.width}"></div>`;
  html += `<div class="form-group"><label>高さ (px)</label><input type="number" id="prop-height" value="${comp.style.height}"></div>`;
  html += `<div class="form-group"><label>X (px)</label><input type="number" id="prop-left" value="${comp.style.left}"></div>`;
  html += `<div class="form-group"><label>Y (px)</label><input type="number" id="prop-top" value="${comp.style.top}"></div>`;

  if (comp.type === 'heading' || comp.type === 'text') {
    html += `<div class="form-group"><label>フォントサイズ (px)</label><input type="number" id="prop-fontsize" value="${comp.style.fontSize || 16}"></div>`;
    html += `<div class="form-group"><label>文字色</label><input type="color" id="prop-color" value="${toHex(comp.style.color || '#333333')}"></div>`;
    html += `<div class="form-group"><label>背景色</label><input type="color" id="prop-bg" value="${toHex(comp.style.background || '#ffffff')}"></div>`;
    html += `<div class="form-group"><label>テキスト配置</label><select id="prop-textalign">
      <option value="left" ${comp.style.textAlign==='left'?'selected':''}>左</option>
      <option value="center" ${comp.style.textAlign==='center'?'selected':''}>中央</option>
      <option value="right" ${comp.style.textAlign==='right'?'selected':''}>右</option>
    </select></div>`;
    html += `<div class="form-group"><label>行の高さ</label><input type="number" step="0.1" id="prop-lineheight" value="${comp.style.lineHeight || 1.4}"></div>`;
  }

  if (comp.type === 'button') {
    html += `<div class="form-group"><label>ラベル</label><input type="text" id="prop-content" value="${escapeHtml(comp.content || '')}"></div>`;
    html += `<div class="form-group"><label>リンク先</label><input type="text" id="prop-href" value="${escapeHtml(comp.props.href || '')}"></div>`;
    html += `<div class="form-group"><label>背景色</label><input type="color" id="prop-bg" value="${toHex(comp.style.background || '#00d2ff')}"></div>`;
    html += `<div class="form-group"><label>文字色</label><input type="color" id="prop-color" value="${toHex(comp.style.color || '#000000')}"></div>`;
    html += `<div class="form-group"><label>角丸 (px)</label><input type="number" id="prop-radius" value="${comp.style.borderRadius || 4}"></div>`;
  }

  if (comp.type === 'image') {
    html += `<div class="form-group"><label>角丸 (px)</label><input type="number" id="prop-radius" value="${comp.style.borderRadius || 0}"></div>`;
    html += `<div class="form-group"><label>画像を変更</label><button class="btn btn-secondary" id="prop-change-image" style="width:100%;">ファイルを選択</button></div>`;
  }

  html += `<div style="margin-top:16px;border-top:1px solid #2a2a4a;padding-top:12px;"><button class="btn btn-danger" id="prop-delete" style="width:100%;">このコンポーネントを削除</button></div>`;

  container.innerHTML = html;

  const bind = (id, field, transform = v => v) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener('input', () => {
      const v = transform(el.value);
      comp.style[field] = v;
      scheduleSave();
      renderGuiCanvas();
    });
  };
  bind('prop-width', 'width', v => Math.max(10, parseInt(v) || 10));
  bind('prop-height', 'height', v => Math.max(10, parseInt(v) || 10));
  bind('prop-left', 'left', v => parseInt(v) || 0);
  bind('prop-top', 'top', v => parseInt(v) || 0);
  if (comp.type === 'heading' || comp.type === 'text') {
    bind('prop-fontsize', 'fontSize', v => parseInt(v) || 16);
    bind('prop-color', 'color');
    bind('prop-bg', 'background');
    bind('prop-textalign', 'textAlign');
    bind('prop-lineheight', 'lineHeight', v => parseFloat(v) || 1.4);
  }
  if (comp.type === 'button') {
    const contentEl = $('prop-content');
    if (contentEl) contentEl.addEventListener('input', () => {
      comp.content = contentEl.value;
      scheduleSave();
      renderGuiCanvas();
    });
    const hrefEl = $('prop-href');
    if (hrefEl) hrefEl.addEventListener('input', () => {
      comp.props.href = hrefEl.value;
      scheduleSave();
    });
    bind('prop-bg', 'background');
    bind('prop-color', 'color');
    bind('prop-radius', 'borderRadius', v => parseInt(v) || 0);
  }
  if (comp.type === 'image') {
    bind('prop-radius', 'borderRadius', v => parseInt(v) || 0);
    const btn = $('prop-change-image');
    if (btn) btn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) { toast('10MBを超えています', true); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          comp.props.src = ev.target.result;
          scheduleSave();
          renderGuiCanvas();
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });
  }

  const delBtn = $('prop-delete');
  if (delBtn) delBtn.addEventListener('click', () => {
    if (!confirm('このコンポーネントを削除しますか？')) return;
    state.guiComponents = state.guiComponents.filter(c => c.id !== comp.id);
    if (state.selectedId === comp.id) deselectComponent();
    scheduleSave();
    renderGuiCanvas();
  });
}

// ============================================================
// GUI：プリセット適用
// ============================================================
function applyGuiPreset(presetId) {
  const preset = GUI_PRESETS.find(p => p.id === presetId);
  if (!preset) return;

  state.guiComponents = preset.components.map(c => ({
    ...c,
    id: uuid(),
    props: { ...(c.props || {}) },
    style: { ...c.style },
  }));
  state.guiBackground = preset.background || '#ffffff';
  state.selectedId = null;
  scheduleSave();
  renderGuiCanvas();
  toast('プリセットを適用しました');
}

// ============================================================
// GUI：HTML生成
// ============================================================
function generateHtmlFromGui() {
  const canvasWidth = canvas.offsetWidth || 1000;
  const canvasHeight = Math.max(canvas.offsetHeight, 800);
  let inner = '';

  state.guiComponents.forEach(comp => {
    const s = comp.style;
    let content = '';

    if (comp.type === 'heading') {
      content = `<h2 style="margin:0;font-size:${s.fontSize}px;color:${s.color};text-align:${s.textAlign};line-height:${s.lineHeight};background:${s.background || 'transparent'};">${escapeHtml(comp.content)}</h2>`;
    } else if (comp.type === 'text') {
      content = `<div style="margin:0;font-size:${s.fontSize}px;color:${s.color};text-align:${s.textAlign};line-height:${s.lineHeight};background:${s.background || 'transparent'};white-space:pre-wrap;">${escapeHtml(comp.content)}</div>`;
    } else if (comp.type === 'image') {
      content = `<img src="${comp.props.src}" style="width:100%;height:100%;object-fit:cover;border-radius:${s.borderRadius || 0}px;">`;
    } else if (comp.type === 'button') {
      content = `<a href="${escapeHtml(comp.props.href || '#')}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:${s.background};color:${s.color};border-radius:${s.borderRadius || 0}px;text-decoration:none;font-weight:bold;">${escapeHtml(comp.content || 'ボタン')}</a>`;
    } else if (comp.type === 'divider') {
      content = `<hr style="border:none;border-top:2px solid #ccc;margin:0;">`;
    } else if (comp.type === 'spacer') {
      content = '';
    }

    inner += `<div style="position:absolute;left:${s.left}px;top:${s.top}px;width:${s.width}px;height:${s.height}px;box-sizing:border-box;overflow:hidden;border-radius:${s.borderRadius || 0}px;">${content}</div>`;
  });

  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(state.slug || 'マイページ')}</title>
<style>
  html, body { margin: 0; padding: 0; background: ${state.guiBackground || '#ffffff'}; }
  .canvas { position: relative; width: 100%; max-width: ${canvasWidth}px; min-height: ${canvasHeight}px; margin: 0 auto; }
</style>
</head>
<body>
  <div class="canvas" style="position:relative;width:100%;max-width:${canvasWidth}px;min-height:${canvasHeight}px;margin:0 auto;">${inner}</div>
</body>
</html>`;
}

// ============================================================
// GUI：画像アップロード（公開時）
// ============================================================
async function uploadGuiImages() {
  for (const comp of state.guiComponents) {
    if (comp.type === 'image' && comp.props.src && comp.props.src.startsWith('data:')) {
      try {
        const ext = (comp.props.src.match(/^data:image\/([a-z]+);/) || [,'png'])[1];
        const filename = 'image_' + comp.id + '.' + (ext === 'jpeg' ? 'jpg' : ext);
        const res = await api('uploadSiteImage', {
          slug: state.slug,
          filename: filename,
          dataUrl: comp.props.src,
        });
        comp.props.src = res.absoluteUrl;
      } catch (e) {
        console.warn('画像アップロード失敗:', e);
        toast('一部の画像のアップロードに失敗しました: ' + e.message, true);
      }
    }
  }
}

// ============================================================
// 公開
// ============================================================
$('publish-btn').addEventListener('click', async () => {
  const slugErr = validateSlugLocal(state.slug);
  if (slugErr) { toast(slugErr, true); return; }

  let html;
  if (state.mode === 'manual') {
    if (!state.html.trim()) { toast('HTMLが空です', true); return; }
    html = state.html;
  } else {
    if (state.guiComponents.length === 0) { toast('コンポーネントがありません', true); return; }
    showLoader();
    try {
      await uploadGuiImages();
    } catch (e) {
      hideLoader();
      toast('画像のアップロードに失敗しました', true);
      return;
    }
    hideLoader();
    html = generateHtmlFromGui();
  }

  if (!confirm(`ページ名「${state.slug}」で公開します。\n公開URL: https://cpmcarshop.github.io/${state.slug}/\n\n初回は反映まで1〜3分かかります。よろしいですか？`)) return;

  try {
    showLoader();
    await api('publishMakerSite', { slug: state.slug, html, mode: state.mode });
    clearDraft();
    state.isDirty = false;
    toast('✓ 公開しました。反映まで1〜3分お待ちください');
    try { state.site = await api('getMySite'); renderSiteInfo(); $('slug-input').disabled = true; } catch (e) {}
  } catch (e) { toast('公開失敗: ' + e.message, true); }
  finally { hideLoader(); }
});

// ============================================================
// 削除
// ============================================================
$('delete-btn').addEventListener('click', async () => {
  if (!state.site || !state.site.hasSite) return;
  const slug = state.site.slug;
  const input = prompt(`サイト「${slug}」を削除します。取り消せません。\n続行するにはページ名「${slug}」を入力：`);
  if (input !== slug) { if (input !== null) toast('ページ名が一致しません', true); return; }
  try {
    showLoader();
    await api('deleteMakerSite');
    toast('サイトを削除しました');
    state.site = { hasSite: false }; state.slug = '';
    state.html = PRESETS[0].html;
    state.guiComponents = []; state.guiBackground = '#ffffff';
    $('slug-input').value = ''; $('slug-input').disabled = false; $('slug-input').classList.remove('valid', 'invalid');
    $('html-editor').value = state.html;
    $('delete-btn').style.display = 'none'; $('site-info-bar').style.display = 'none';
    clearDraft();
    renderGuiCanvas();
    updatePreview();
  } catch (e) { toast('削除失敗: ' + e.message, true); }
  finally { hideLoader(); }
});

// ============================================================
// 認証
// ============================================================
onAuthStateChanged(auth, async (user) => {
  state.user = user;
  if (user) await initAfterLogin(user);
  else showScreen('login');
});

$('login-google').addEventListener('click', async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch (e) { if (e.code !== 'auth/popup-closed-by-user') toast('ログイン失敗: ' + e.message, true); }
});
$('logout-from-notmaker')?.addEventListener('click', () => signOut(auth));
$('logout-btn').addEventListener('click', async () => {
  if (state.isDirty && !confirm('保存されていない変更があります。ログアウトしますか？')) return;
  await signOut(auth);
});

// ============================================================
// 手動モード：エディタイベント
// ============================================================
$('html-editor').addEventListener('input', (e) => {
  state.html = e.target.value;
  updatePreview();
  scheduleSave();
});
$('slug-input').addEventListener('input', (e) => {
  state.slug = e.target.value;
  const err = validateSlugLocal(state.slug);
  e.target.classList.toggle('valid', !err);
  e.target.classList.toggle('invalid', !!err);
  scheduleSave();
});
$('slug-check-btn').addEventListener('click', async () => {
  const err = validateSlugLocal(state.slug);
  if (err) { toast(err, true); return; }
  try {
    showLoader();
    const r = await api('checkPageName', { slug: state.slug });
    toast(r.available ? (r.isUpdate ? '✓ 現在のページ名です' : '✓ このページ名は使えます') : r.reason, !r.available);
  } catch (e) { toast(e.message, true); }
  finally { hideLoader(); }
});

// ============================================================
// モバイルタブ
// ============================================================
function switchMobilePane(pane) {
  document.querySelectorAll('#mobile-tabs button').forEach(b => b.classList.toggle('active', b.dataset.pane === pane));
  if (window.innerWidth <= 768) {
    $('pane-editor').classList.toggle('hidden-on-mobile', pane !== 'editor');
    $('pane-preview').classList.toggle('hidden-on-mobile', pane !== 'preview');
  }
}
$('mobile-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-pane]');
  if (btn) switchMobilePane(btn.dataset.pane);
});
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) {
    $('pane-editor').classList.remove('hidden-on-mobile');
    $('pane-preview').classList.remove('hidden-on-mobile');
  } else {
    const active = document.querySelector('#mobile-tabs button.active')?.dataset.pane || 'editor';
    switchMobilePane(active);
  }
});
window.dispatchEvent(new Event('resize'));

window.addEventListener('beforeunload', (e) => {
  if (state.isDirty) { e.preventDefault(); e.returnValue = ''; }
});

// ============================================================
// プリセットモーダル
// ============================================================
$('preset-btn').addEventListener('click', () => {
  const list = state.mode === 'manual' ? PRESETS : GUI_PRESETS;
  $('presets-list').innerHTML = list.map(p => `<div class="preset-item" data-preset="${p.id}"><strong>${escapeHtml(p.name)}</strong><span>${escapeHtml(p.desc)}</span></div>`).join('');
  $('preset-modal').classList.add('active');
});
$('presets-list').addEventListener('click', (e) => {
  const item = e.target.closest('[data-preset]');
  if (!item) return;
  const presetId = item.dataset.preset;

  if (state.mode === 'manual') {
    const preset = PRESETS.find(p => p.id === presetId);
    if (!preset) return;
    if (state.html && state.html !== PRESETS[0].html && !confirm('現在の内容を置き換えます。よろしいですか？')) return;
    state.html = preset.html;
    $('html-editor').value = preset.html;
    updatePreview();
    scheduleSave();
  } else {
    if (state.guiComponents.length > 0 && !confirm('現在の内容を置き換えます。よろしいですか？')) return;
    applyGuiPreset(presetId);
  }

  $('preset-modal').classList.remove('active');
});
$('preset-modal-close').addEventListener('click', () => $('preset-modal').classList.remove('active'));

// ============================================================
// 画像アップロードモーダル（手動モード用）
// ============================================================
$('image-btn')?.addEventListener('click', () => {
  const err = validateSlugLocal(state.slug);
  if (err) { toast('先にページ名を入力してください: ' + err, true); return; }
  $('upload-list').innerHTML = '';
  $('image-modal').classList.add('active');
});
$('image-modal-close').addEventListener('click', () => $('image-modal').classList.remove('active'));

const dropZone = $('drop-zone');
const imageInput = $('image-input');
if (dropZone && imageInput) {
  dropZone.addEventListener('click', () => imageInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length) handleFiles(files);
  });
  imageInput.addEventListener('change', () => {
    if (imageInput.files.length) handleFiles(Array.from(imageInput.files));
    imageInput.value = '';
  });
}

async function handleFiles(files) {
  const list = $('upload-list');
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) { addUploadItem(list, file.name, 'error', '10MB超'); continue; }
    const item = addUploadItem(list, file.name, '', 'アップロード中...');
    try {
      const dataUrl = await readAsDataURL(file);
      const r = await api('uploadSiteImage', { slug: state.slug, filename: file.name, dataUrl });
      item.classList.add('done');
      item.querySelector('.status').textContent = '完了';
      const tag = `<img src="${r.absoluteUrl}" alt="${escapeHtml(file.name)}" style="max-width:100%;">`;
      insertAtCursor($('html-editor'), tag);
      state.html = $('html-editor').value;
      updatePreview();
      scheduleSave();
    } catch (e) {
      item.classList.add('error');
      item.querySelector('.status').textContent = e.message;
    }
  }
}
function addUploadItem(container, name, cls, status) {
  const div = document.createElement('div');
  div.className = 'upload-item ' + cls;
  div.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(name)}</span><span class="status">${escapeHtml(status)}</span>`;
  container.appendChild(div);
  return div;
}
function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}
function insertAtCursor(textarea, text) {
  const s = textarea.selectionStart, e = textarea.selectionEnd;
  textarea.value = textarea.value.substring(0, s) + text + textarea.value.substring(e);
  textarea.selectionStart = textarea.selectionEnd = s + text.length;
  textarea.focus();
}
</script>
