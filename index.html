<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>メーカーページ作成 - 架空車街</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', sans-serif; background: #0a0c1b; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.screen { display: none; height: 100%; flex-direction: column; }
.screen.active { display: flex; }
#login-screen, #not-maker-screen { align-items: center; justify-content: center; padding: 20px; }
.login-box, .not-maker-box { background: #16213e; padding: 40px 30px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; }
.login-box { border: 1px solid #00d2ff; }
.login-box h1 { color: #00d2ff; margin: 0 0 20px; }
.not-maker-box { border: 1px solid #e94560; }
.not-maker-box h2 { color: #e94560; margin: 0 0 16px; }

.toolbar { background: #16213e; border-bottom: 1px solid #2a2a4a; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.toolbar .brand { font-weight: bold; color: #00d2ff; margin-right: 8px; }
.toolbar input[type="text"] { padding: 6px 10px; background: #0a0c1b; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit; min-width: 150px; }
.toolbar input.valid { border-color: #4caf50; }
.toolbar input.invalid { border-color: #e94560; }
.toolbar select { padding: 6px 10px; background: #0a0c1b; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit; }

button.btn { padding: 8px 16px; background: #00d2ff; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.9rem; text-decoration: none; display: inline-block; }
button.btn:hover { background: #00a2c7; }
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
button.btn-secondary { background: #444; color: #fff; }
button.btn-secondary:hover { background: #555; }
button.btn-danger { background: #e94560; color: #fff; }
button.btn-danger:hover { background: #c73050; }
button.btn-sm { padding: 4px 10px; font-size: 0.75rem; }

.mode-tabs { display: flex; background: #0a0c1b; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; }
.mode-tabs button { flex: 1; padding: 10px; background: transparent; color: #888; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
.mode-tabs button.active { color: #00d2ff; border-bottom-color: #00d2ff; background: rgba(0,210,255,0.05); }

.editor-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ===== 手動モード ===== */
.manual-container { display: flex; width: 100%; height: 100%; }
.manual-input { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.manual-input textarea { flex: 1; width: 100%; padding: 16px; background: #0a0c1b; color: #e0e0e0; border: none; resize: none; font-family: 'SF Mono', Consolas, monospace; font-size: 13px; line-height: 1.6; outline: none; min-height: 0; }
.manual-preview { flex: 1; min-width: 0; background: #fff; border-left: 1px solid #2a2a4a; }
.manual-preview iframe { width: 100%; height: 100%; border: none; display: block; }

/* ===== GUIモード（ブロックベース） ===== */
.gui-container { display: flex; flex-direction: column; width: 100%; height: 100%; }

/* ページタブ */
.page-tabs { display: flex; align-items: center; gap: 4px; background: #16213e; border-bottom: 1px solid #2a2a4a; padding: 8px 12px; overflow-x: auto; flex-shrink: 0; }
.page-tab { padding: 6px 14px; background: transparent; border: 1px solid transparent; border-radius: 4px; color: #aaa; font-family: inherit; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
.page-tab:hover { background: rgba(255,255,255,0.05); }
.page-tab.active { background: rgba(0,210,255,0.15); border-color: #00d2ff; color: #00d2ff; font-weight: bold; }
.page-tab-del { color: #e94560; margin-left: 6px; font-size: 0.9rem; opacity: 0.6; }
.page-tab-del:hover { opacity: 1; }

/* エディタ本体 */
.gui-main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* 左パレット */
.section-palette { width: 200px; flex-shrink: 0; background: #16213e; border-right: 1px solid #2a2a4a; overflow-y: auto; padding: 16px 12px; }
.section-palette h4 { margin: 0 0 14px; font-size: 0.75rem; color: #00d2ff; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
.section-palette button { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 6px; padding: 10px 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; color: #ccc; font-family: inherit; font-size: 0.82rem; cursor: pointer; text-align: left; transition: all 0.15s; }
.section-palette button:hover { background: rgba(0,210,255,0.1); border-color: rgba(0,210,255,0.4); color: #00d2ff; transform: translateX(2px); }
.section-palette button .icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: rgba(0,210,255,0.08); border-radius: 6px; font-size: 0.8rem; flex-shrink: 0; }

/* 中央キャンバス */
.canvas-wrapper { flex: 1; min-width: 0; overflow-y: auto; background: #0f0f1a; padding: 24px; }
.canvas-frame { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 4px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); overflow: hidden; }
.canvas-frame iframe { width: 100%; border: none; display: block; background: #fff; }

/* セクションリスト（エディタ用） */
.section-list { display: flex; flex-direction: column; gap: 8px; max-width: 900px; margin: 0 auto; }
.section-block { position: relative; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 12px; cursor: pointer; transition: border-color 0.15s; }
.section-block:hover { border-color: rgba(0,210,255,0.5); }
.section-block.selected { border-color: #00d2ff; box-shadow: 0 0 0 2px rgba(0,210,255,0.2); }
.section-block-label { font-size: 0.7rem; color: #00d2ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.section-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.section-block:hover .section-actions { opacity: 1; }
.section-actions button { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; }
.section-actions button:hover { background: #00d2ff; color: #000; }
.section-preview { color: #888; font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 右プロパティ */
.properties-panel { width: 280px; flex-shrink: 0; background: #16213e; border-left: 1px solid #2a2a4a; overflow-y: auto; padding: 16px 12px; }
.properties-panel h4 { margin: 0 0 14px; font-size: 0.75rem; color: #00d2ff; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
.prop-group { margin-bottom: 14px; }
.prop-group label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 5px; letter-spacing: 0.5px; }
.prop-group input[type="text"], .prop-group input[type="number"], .prop-group textarea, .prop-group select { width: 100%; padding: 8px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 6px; font-family: inherit; font-size: 0.85rem; }
.prop-group input:focus, .prop-group textarea:focus, .prop-group select:focus { border-color: #00d2ff; outline: none; }
.prop-group textarea { resize: vertical; min-height: 60px; }
.prop-list-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
.prop-list-item .prop-list-del { float: right; color: #e94560; cursor: pointer; font-size: 0.85rem; }
.prop-empty { color: #555; font-size: 0.8rem; text-align: center; padding: 30px 0; line-height: 1.6; }

/* モーダル */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #16213e; border: 1px solid #00d2ff; border-radius: 8px; padding: 24px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal-content h3 { margin: 0 0 16px; color: #00d2ff; }

.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.theme-card { border: 2px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
.theme-card:hover { border-color: #00d2ff; transform: translateY(-2px); }
.theme-card.selected { border-color: #00d2ff; }
.theme-thumb { height: 90px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; }
.theme-meta { padding: 10px 12px; background: rgba(0,0,0,0.3); }
.theme-meta strong { display: block; color: #00d2ff; font-size: 0.9rem; margin-bottom: 2px; }
.theme-meta span { font-size: 0.72rem; color: #999; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #16213e; color: #fff; padding: 12px 24px; border-radius: 8px; border: 1px solid #00d2ff; z-index: 2000; transition: transform 0.3s; max-width: 90%; font-size: 0.9rem; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.error { border-color: #e94560; }

.site-info { background: #16213e; padding: 8px 12px; font-size: 0.8rem; border-bottom: 1px solid #2a2a4a; color: #aaa; flex-shrink: 0; }
.site-info a { color: #00d2ff; }
.site-info .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin-left: 8px; }
.site-info .status-badge.published { background: #4caf50; color: #fff; }
.site-info .status-badge.draft { background: #ff9800; color: #000; }

.loader-overlay { position: fixed; inset: 0; background: rgba(10,12,27,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; }
.loader-overlay.active { display: flex; }
.loader-overlay .spinner { width: 60px; height: 60px; border: 4px solid #333; border-top-color: #00d2ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  .section-palette { width: 140px; padding: 8px; }
  .properties-panel { width: 200px; padding: 8px; }
}
</style>
</head>
<body>

<div id="loader" class="loader-overlay"><div class="spinner"></div></div>

<!-- ===== ログイン画面 ===== -->
<div id="login-screen" class="screen">
  <div class="login-box">

</div>

<!-- ===== エディタ画面 ===== -->
<div id="editor-screen" class="screen">
  <div class="toolbar">

          <button data-add="text"><span class="icon">T</span>テキスト</button>
          <button data-add="image"><span class="icon">🖼</span>画像</button>
          <button data-add="cards"><span class="icon">▦</span>カード</button>
          <button data-add="gallery"><span class="icon">▩</span>ギャラリー</button>
          <button data-add="timeline"><span class="icon">⏱</span>タイムライン</button>
          <button data-add="contact"><span class="icon">✉</span>コンタクト</button>

          <div class="section-list" id="section-list"></div>

  </div>
</div>

<!-- ===== テーマ選択モーダル ===== -->
<div id="theme-modal" class="modal">
  <div class="modal-content">
    <h3>🎨 テーマを選択</h3>
    <p style="color:#888; font-size:0.85rem; margin-bottom:16px;">⚠️ 選択すると現在のページ構成が置き換わります。</p>

</div>

<!-- ===== プレビューモーダル ===== -->

<div id="toast"></div>

import {

const state = {

  site: null,
  slug: '',
  mode: 'gui', // 'manual' | 'gui'
  html: '',
  // GUI用
  themeId: 'racing',

  selectedSectionId: null,
  isDirty: false,
};

const $ = (id) => document.getElementById(id);
const uuid = () => 'id_' + Math.random().toString(36).slice(2, 10);

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  const t = $(name + '-screen');
  if (t) t.classList.add('active');
}
function showLoader() { $('loader').classList.add('active'); }
function hideLoader() { $('loader').classList.remove('active'); }
let toastTimer = null;
function toast(msg, isError = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = isError ? 'error show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}
function setDebug(msg) {
  const el = $('debug-uid');
  if (el) el.textContent = msg;
  console.log('[debug]', msg);
}

// ============================================================
// API
// ============================================================
async function api(action, payload = {}) {
  if (!state.user) throw new Error('ログインしていません');
  const token = await state.user.getIdToken();
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ action, payload }),
  });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'APIエラー');
  return data.data;
}

  minimal: {

    desc: '白×黒。余白美と洗練',
    thumbBg: '#fafafa',

    vars: {
      bg: '#fafafa', card: '#ffffff', primary: '#111111', primaryHover: '#333333',

      heroBg: 'linear-gradient(135deg, rgba(250,250,250,0.9), rgba(250,250,250,0.98))',

    },

// ============================================================
// セクションのレンダリング（エディタプレビュー用）
// ============================================================
function renderSectionPreviewHtml(section, themeId) {
  const t = THEMES[themeId] || THEMES.racing;
  const v = t.vars;
  const p = section.props || {};
  let inner = '';

  if (section.type === 'hero') {
    inner = `<div style="padding:80px 20px;text-align:center;background:${p.bgImage ? `linear-gradient(135deg,rgba(0,0,0,0.6),rgba(0,0,0,0.85)),url('${escapeHtml(p.bgImage)}') center/cover` : v.heroBg};">
      <h1 style="font-family:${v.fontEn};font-size:2.5rem;font-weight:900;margin:0 0 12px;color:${v.text};letter-spacing:2px;">${escapeHtml(p.title)}</h1>
      <p style="color:${v.textGray};margin:0 0 24px;font-size:1rem;">${escapeHtml(p.subtitle)}</p>
      <a href="${escapeHtml(p.btnHref || '#')}" style="display:inline-block;padding:12px 28px;background:${v.primary};color:#fff;font-weight:700;font-size:0.9rem;${v.btnStyle}">${escapeHtml(p.btnText || 'VIEW')}</a>
    </div>`;
  } else if (section.type === 'text') {
    inner = `<div style="padding:40px 30px;background:${v.bg};">
      <h2 style="font-family:${v.fontEn};font-size:1.6rem;font-weight:900;margin:0 0 16px;color:${v.text};border-left:4px solid ${v.primary};padding-left:12px;">${escapeHtml(p.title)}</h2>
      <p style="color:${v.textGray};line-height:1.8;margin:0;white-space:pre-wrap;">${escapeHtml(p.body)}</p>
    </div>`;
  } else if (section.type === 'image') {
    inner = `<div style="padding:20px;background:${v.bg};text-align:center;">
      ${p.src ? `<img src="${escapeHtml(p.src)}" style="max-width:100%;border-radius:8px;">` : `<div style="padding:40px;border:2px dashed ${v.border};color:${v.textGray};border-radius:8px;">画像を設定してください</div>`}
      ${p.caption ? `<p style="color:${v.textGray};font-size:0.85rem;margin-top:10px;">${escapeHtml(p.caption)}</p>` : ''}
    </div>`;
  } else if (section.type === 'cards') {
    const items = p.items || [];
    inner = `<div style="padding:40px 30px;background:${v.bg};">
      <h2 style="font-family:${v.fontEn};font-size:1.6rem;font-weight:900;margin:0 0 24px;color:${v.text};border-left:4px solid ${v.primary};padding-left:12px;">${escapeHtml(p.title)}</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;">
        ${items.map(it => `<div style="background:${v.card};border:1px solid ${v.border};border-radius:8px;padding:20px;">
          <span style="font-family:${v.fontEn};font-size:0.7rem;color:${v.primary};font-weight:700;letter-spacing:1px;">${escapeHtml(it.tag)}</span>
          <h3 style="margin:8px 0;color:${v.text};font-size:1.1rem;">${escapeHtml(it.title)}</h3>
          <p style="color:${v.textGray};font-size:0.85rem;margin:0 0 12px;">${escapeHtml(it.desc)}</p>
          <a href="${escapeHtml(it.href || '#')}" style="color:${v.primary};font-size:0.8rem;font-weight:bold;">詳しく見る →</a>
        </div>`).join('')}
      </div>
    </div>`;
  } else if (section.type === 'gallery') {
    const imgs = p.images || [];
    inner = `<div style="padding:40px 30px;background:${v.bg};">
      <h2 style="font-family:${v.fontEn};font-size:1.6rem;font-weight:900;margin:0 0 24px;color:${v.text};border-left:4px solid ${v.primary};padding-left:12px;">${escapeHtml(p.title)}</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;">
        ${imgs.length ? imgs.map(src => `<img src="${escapeHtml(src)}" style="width:100%;height:120px;object-fit:cover;border-radius:6px;">`).join('') : `<div style="padding:30px;border:2px dashed ${v.border};color:${v.textGray};border-radius:8px;text-align:center;">画像を追加してください</div>`}
      </div>
    </div>`;
  } else if (section.type === 'timeline') {
    const items = p.items || [];
    inner = `<div style="padding:40px 30px;background:${v.bg};">
      <h2 style="font-family:${v.fontEn};font-size:1.6rem;font-weight:900;margin:0 0 24px;color:${v.text};border-left:4px solid ${v.primary};padding-left:12px;">${escapeHtml(p.title)}</h2>
      <div style="border-left:2px solid ${v.border};padding-left:20px;">
        ${items.map(it => `<div style="position:relative;margin-bottom:24px;">
          <div style="position:absolute;left:-26px;top:4px;width:10px;height:10px;background:${v.primary};border-radius:50%;"></div>
          <div style="font-family:${v.fontEn};font-size:0.85rem;color:${v.primary};font-weight:700;">${escapeHtml(it.date)}</div>
          <div style="font-weight:700;color:${v.text};margin:4px 0;">${escapeHtml(it.title)}</div>
          <div style="color:${v.textGray};font-size:0.85rem;">${escapeHtml(it.desc)}</div>
        </div>`).join('')}
      </div>
    </div>`;
  } else if (section.type === 'contact') {
    inner = `<div style="padding:50px 20px;background:${v.bg};text-align:center;">
      <h2 style="font-family:${v.fontEn};font-size:1.6rem;font-weight:900;margin:0 0 12px;color:${v.text};">${escapeHtml(p.title)}</h2>
      <p style="color:${v.textGray};margin:0 0 20px;">${escapeHtml(p.body)}</p>
      <a href="${escapeHtml(p.btnHref || '#')}" style="display:inline-block;padding:12px 28px;background:${v.primary};color:#fff;font-weight:700;${v.btnStyle}">${escapeHtml(p.btnText || 'CONTACT')}</a>
    </div>`;
  } else if (section.type === 'spacer') {
    inner = `<div style="height:${p.height || 60}px;background:${v.bg};"></div>`;
  }

  return inner;
}

// ============================================================
// HTML生成（公開用）
// ============================================================
function generateSiteHtml() {
  const t = THEMES[state.themeId] || THEMES.racing;
  const v = t.vars;

  const pageHtml = state.pages.map((page, idx) => {
    const sections = page.sections.map(s => renderSectionPreviewHtml(s, state.themeId)).join('');
    return `<div class="page" id="page-${page.id}" style="display:${idx === 0 ? 'block' : 'none'};">${sections}</div>`;
  }).join('');

  const navHtml = state.pages.map((page, idx) => 
    `<a href="#page-${page.id}" class="nav-link" data-page="${page.id}">${escapeHtml(page.name)}</a>`
  ).join('');

  const fonts = `<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">`;

  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="${escapeHtml(state.maker?.makerName || '')} の公式サイト">
<title>${escapeHtml(state.maker?.makerName || state.slug)}</title>
${fonts}
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: ${v.bg}; color: ${v.text}; font-family: ${v.fontMain}; line-height: 1.6; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  header { position: sticky; top: 0; z-index: 100; background: ${v.bg}ee; backdrop-filter: blur(8px); border-bottom: 1px solid ${v.border}; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: ${v.fontEn}; font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; color: ${v.text}; }
  nav { display: flex; gap: 16px; flex-wrap: wrap; }
  .nav-link { font-size: 0.85rem; font-weight: 600; color: ${v.textGray}; transition: color 0.2s; }
  .nav-link:hover, .nav-link.active { color: ${v.primary}; }
  .page { display: none; }
  .page.active { display: block; }
  footer { text-align: center; padding: 30px 20px; border-top: 1px solid ${v.border}; color: ${v.textGray}; font-size: 0.8rem; }
  @media (max-width: 600px) {
    header { padding: 10px 14px; flex-direction: column; gap: 8px; }
    nav { justify-content: center; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">${escapeHtml(state.maker?.makerName || 'MY SITE')}</div>
    <nav>${navHtml}</nav>
  </header>
  ${pageHtml}
  <footer>&copy; ${escapeHtml(state.maker?.makerName || '')} — Created with 架空車街</footer>
  <script>
    function showPage() {
      var hash = location.hash.replace('#page-', '') || '${state.pages[0]?.id || ''}';
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); p.style.display = 'none'; });
      var target = document.getElementById('page-' + hash);
      if (target) { target.classList.add('active'); target.style.display = 'block'; }
      document.querySelectorAll('.nav-link').forEach(function(a) {
        a.classList.toggle('active', a.dataset.page === hash);
      });
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', showPage);
    showPage();
  <\/script>
</body>
</html>`;
}

function renderPageTabs() {
  const container = $('page-tabs');
  const html = state.pages.map(p => {
    const del = state.pages.length > 1 ? `<span class="page-tab-del" data-del-page="${p.id}">×</span>` : '';
    return `<button class="page-tab ${p.id === state.currentPageId ? 'active' : ''}" data-page-id="${p.id}">${escapeHtml(p.name)}${del}</button>`;
  }).join('');
  const addBtn = `<button class="page-tab" id="add-page-btn" style="color:#00d2ff;">＋ ページ追加</button>`;
  container.innerHTML = html + addBtn;
}

// ============================================================
// エディタ：セクションリスト
// ============================================================
function renderSectionList() {
  const page = state.pages.find(p => p.id === state.currentPageId);
  const container = $('section-list');
  if (!page) { container.innerHTML = ''; return; }

  if (page.sections.length === 0) {
    container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#555;border:2px dashed rgba(255,255,255,0.1);border-radius:8px;">左のパレットからセクションを追加してください</div>`;
    return;
  }

  container.innerHTML = page.sections.map((sec, idx) => {
    const t = SECTION_NAMES[sec.type] || sec.type;
    return `<div class="section-block ${sec.id === state.selectedSectionId ? 'selected' : ''}" data-section-id="${sec.id}">
      <div class="section-block-label">
        <span>${t}</span>
        <div class="section-actions">
          <button data-move-up="${sec.id}" title="上へ">↑</button>
          <button data-move-down="${sec.id}" title="下へ">↓</button>
          <button data-delete="${sec.id}" title="削除">🗑</button>
        </div>
      </div>
      <div class="section-preview">${escapeHtml(SECTION_DESCS[sec.type] ? SECTION_DESCS[sec.type](sec) : '')}</div>
    </div>`;
  }).join('');
}

const SECTION_NAMES = {
  hero: 'ヒーロー',
  text: 'テキスト',
  image: '画像',
  cards: 'カード',
  gallery: 'ギャラリー',
  timeline: 'タイムライン',
  contact: 'コンタクト',
  spacer: '余白',
};
const SECTION_DESCS = {
  hero: s => s.props.title || 'タイトル未設定',
  text: s => s.props.title || 'タイトル未設定',
  image: s => s.props.caption || s.props.src || '画像未設定',
  cards: s => `${(s.props.items||[]).length} 枚のカード`,
  gallery: s => `${(s.props.images||[]).length} 枚の画像`,
  timeline: s => `${(s.props.items||[]).length} 件の履歴`,
  contact: s => s.props.title || 'コンタクト',
  spacer: s => `高さ ${s.props.height || 60}px`,
};

function renderPropertiesPanel() {
  const container = $('properties-content');

  if (!section) {
    container.innerHTML = `<div class="prop-empty">セクションを選択してください</div>`;

    html += `<div class="prop-group"><label>タイトル</label><input type="text" id="p-title" value="${escapeHtml(p.title)}"></div>`;

  } else if (section.type === 'contact') {
    html += `<div class="prop-group"><label>見出し</label><input type="text" id="p-title" value="${escapeHtml(p.title)}"></div>`;
    html += `<div class="prop-group"><label>本文</label><textarea id="p-body">${escapeHtml(p.body)}</textarea></div>`;
    html += `<div class="prop-group"><label>ボタンテキスト</label><input type="text" id="p-btnText" value="${escapeHtml(p.btnText)}"></div>`;
    html += `<div class="prop-group"><label>ボタンリンク</label><input type="text" id="p-btnHref" value="${escapeHtml(p.btnHref)}"></div>`;
  } else if (section.type === 'spacer') {
    html += `<div class="prop-group"><label>高さ (px)</label><input type="number" id="p-height" value="${p.height || 60}"></div>`;
  }

  container.innerHTML = html;

  // イベント登録（共通）
  const bindText = (id, key) => {
    const el = $(id);
    if (el) el.addEventListener('input', () => {
      section.props[key] = el.value;
      scheduleSave();
      renderSectionList();
    });
  };
  ['title','subtitle','btnText','btnHref','bgImage','body','caption','height','src'].forEach(k => bindText('p-' + k, k));

  // 画像アップロード
  const uploadBtn = $('p-upload-img');
  if (uploadBtn) uploadBtn.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        section.props.src = ev.target.result;
        $('p-src').value = ev.target.result;
        scheduleSave();
        renderSectionList();
      };
      reader.readAsDataURL(file);
    };
    input.click();
  });

  // カードリスト
  if (section.type === 'cards') {
    renderCardsList(section);
    const addBtn = $('p-add-card');
    if (addBtn) addBtn.addEventListener('click', () => {
      section.props.items = section.props.items || [];
      section.props.items.push({ tag: '', title: '新しいカード', desc: '', href: '#' });
      scheduleSave();
      renderPropertiesPanel();
      renderSectionList();
    });
  }

  // ギャラリー
  if (section.type === 'gallery') {
    renderGalleryList(section);
    const addBtn = $('p-add-gallery');
    if (addBtn) addBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          section.props.images = section.props.images || [];
          section.props.images.push(ev.target.result);
          scheduleSave();
          renderPropertiesPanel();
          renderSectionList();
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });
  }

  // タイムライン
  if (section.type === 'timeline') {
    renderTimelineList(section);
    const addBtn = $('p-add-timeline');
    if (addBtn) addBtn.addEventListener('click', () => {
      section.props.items = section.props.items || [];
      section.props.items.push({ date: '', title: '新しい出来事', desc: '' });
      scheduleSave();
      renderPropertiesPanel();
      renderSectionList();
    });
  }
}

function renderCardsList(section) {
  const list = $('p-cards-list');
  if (!list) return;
  const items = section.props.items || [];
  list.innerHTML = items.map((it, i) => `
    <div class="prop-list-item">
      <span class="prop-list-del" data-del-card="${i}">×</span>
      <input type="text" value="${escapeHtml(it.tag)}" placeholder="タグ" data-card-field="tag" data-card-idx="${i}" style="width:100%;margin-bottom:4px;">
      <input type="text" value="${escapeHtml(it.title)}" placeholder="タイトル" data-card-field="title" data-card-idx="${i}" style="width:100%;margin-bottom:4px;">
      <textarea placeholder="説明" data-card-field="desc" data-card-idx="${i}" style="width:100%;margin-bottom:4px;">${escapeHtml(it.desc)}</textarea>
      <input type="text" value="${escapeHtml(it.href)}" placeholder="リンク" data-card-field="href" data-card-idx="${i}" style="width:100%;">
    </div>
  `).join('');

  list.querySelectorAll('[data-card-field]').forEach(el => {
    el.addEventListener('input', () => {
      const i = Number(el.dataset.cardIdx);
      section.props.items[i][el.dataset.cardField] = el.value;
      scheduleSave();
      renderSectionList();
    });
  });
  list.querySelectorAll('[data-del-card]').forEach(el => {
    el.addEventListener('click', () => {
      section.props.items.splice(Number(el.dataset.delCard), 1);
      scheduleSave();
      renderPropertiesPanel();
      renderSectionList();
    });
  });
}

function renderGalleryList(section) {
  const list = $('p-gallery-list');
  if (!list) return;
  const imgs = section.props.images || [];
  list.innerHTML = imgs.map((src, i) => `
    <div class="prop-list-item" style="display:flex;align-items:center;gap:8px;">
      <img src="${escapeHtml(src)}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;">
      <span style="flex:1;font-size:0.7rem;color:#888;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(src.substring(0,30))}...</span>
      <span class="prop-list-del" data-del-gallery="${i}">×</span>
    </div>
  `).join('');
  list.querySelectorAll('[data-del-gallery]').forEach(el => {
    el.addEventListener('click', () => {
      section.props.images.splice(Number(el.dataset.delGallery), 1);
      scheduleSave();
      renderPropertiesPanel();
      renderSectionList();
    });
  });
}

function renderTimelineList(section) {
  const list = $('p-timeline-list');
  if (!list) return;
  const items = section.props.items || [];
  list.innerHTML = items.map((it, i) => `
    <div class="prop-list-item">
      <span class="prop-list-del" data-del-timeline="${i}">×</span>
      <input type="text" value="${escapeHtml(it.date)}" placeholder="日付" data-tl-field="date" data-tl-idx="${i}" style="width:100%;margin-bottom:4px;">
      <input type="text" value="${escapeHtml(it.title)}" placeholder="タイトル" data-tl-field="title" data-tl-idx="${i}" style="width:100%;margin-bottom:4px;">
      <textarea placeholder="説明" data-tl-field="desc" data-tl-idx="${i}" style="width:100%;">${escapeHtml(it.desc)}</textarea>
    </div>
  `).join('');
  list.querySelectorAll('[data-tl-field]').forEach(el => {
    el.addEventListener('input', () => {
      const i = Number(el.dataset.tlIdx);
      section.props.items[i][el.dataset.tlField] = el.value;
      scheduleSave();
      renderSectionList();
    });
  });
  list.querySelectorAll('[data-del-timeline]').forEach(el => {
    el.addEventListener('click', () => {
      section.props.items.splice(Number(el.dataset.delTimeline), 1);
      scheduleSave();
      renderPropertiesPanel();
      renderSectionList();
    });
  });
}

// ============================================================
// セクション追加
// ============================================================
const DEFAULT_SECTION_PROPS = {
  hero: () => ({ title: 'キャッチコピー', subtitle: 'サブタイトルをここに', btnText: 'VIEW MORE', btnHref: '#', bgImage: '' }),
  text: () => ({ title: '見出し', body: '本文をここに書きます。' }),
  image: () => ({ src: '', caption: '' }),
  cards: () => ({ title: 'カード', items: [{ tag: 'TAG', title: 'カード1', desc: '説明', href: '#' }] }),
  gallery: () => ({ title: 'ギャラリー', images: [] }),
  timeline: () => ({ title: 'タイムライン', items: [{ date: '2025/01/01', title: '出来事', desc: '説明' }] }),
  contact: () => ({ title: 'CONTACT', body: 'お問い合わせはこちら。', btnText: 'お問い合わせ', btnHref: '#' }),
  spacer: () => ({ height: 60 }),
};

function addSection(type) {
  const page = state.pages.find(p => p.id === state.currentPageId);
  if (!page) return;
  const sec = {
    id: uuid(),
    type,
    props: DEFAULT_SECTION_PROPS[type] ? DEFAULT_SECTION_PROPS[type]() : {},
  };
  page.sections.push(sec);
  state.selectedSectionId = sec.id;
  scheduleSave();
  renderSectionList();
  renderPropertiesPanel();
  toast('セクションを追加しました');
}

// ============================================================
// 保存・復元
// ============================================================
function scheduleSave() {
  state.isDirty = true;
  clearTimeout(scheduleSave._t);
  scheduleSave._t = setTimeout(saveDraft, SAVE_DEBOUNCE);
}
function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      slug: state.slug,
      themeId: state.themeId,
      pages: state.pages,
      currentPageId: state.currentPageId,
      savedAt: Date.now(),
    }));
    state.isDirty = false;
  } catch (e) {}
}
function loadDraft() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    return r ? JSON.parse(r) : null;
  } catch (e) { return null; }
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// ============================================================
// サイト情報表示
// ============================================================
function renderSiteInfo() {
  const bar = $('site-info-bar');
  if (!state.site || !state.site.hasSite) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const s = state.site;
  const cls = s.published ? 'published' : 'draft';
  const txt = s.published ? '公開中' : '下書き';
  bar.innerHTML = `ページ名: <strong>${escapeHtml(s.slug)}</strong><span class="status-badge ${cls}">${txt}</span>${s.published ? ` | <a href="${s.publicUrl}" target="_blank" rel="noopener">公開URL</a>` : ''}`;
  $('delete-btn').style.display = 'inline-block';
}

// ============================================================
// 初期化
// ============================================================
async function initAfterLogin(user) {
  showLoader();
  try {
    let makerInfo;
    try { makerInfo = await api('getMyMakerInfo'); }
    catch (e) {
      setDebug('Your UID: ' + user.uid + '\nエラー: ' + e.message);
      showScreen('not-maker'); return;
    }
    const maker = makerInfo && makerInfo.maker;
    if (!maker) {
      const d = (makerInfo && makerInfo.debug) || {};
      setDebug('Your UID: ' + user.uid + '\nmakerFound: ' + d.makerFound);
      showScreen('not-maker'); return;
    }
    state.maker = maker;

    try { state.site = await api('getMySite'); }
    catch (e) { state.site = { hasSite: false }; }

    if (state.site.hasSite) {
      state.slug = state.site.slug;
      $('slug-input').value = state.slug;
      $('slug-input').disabled = true;
      $('slug-input').classList.add('valid');
      state.mode = state.site.mode === 'manual' ? 'manual' : 'gui';
    }

    // ドラフト復元 or テーマ初期化
    const draft = loadDraft();
    if (draft && draft.slug === state.slug && draft.pages) {
      state.themeId = draft.themeId || 'racing';
      state.pages = draft.pages;
      state.currentPageId = draft.currentPageId || state.pages[0]?.id;
    } else {
      state.themeId = 'racing';
      state.pages = THEMES.racing.defaultPages();
      state.currentPageId = state.pages[0]?.id;
    }

    // 手動モードのHTML（最低限）
    if (!state.html) state.html = '<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><title>My Page</title></head>\n<body>\n<h1>Hello</h1>\n</body>\n</html>';

    // 初期描画
    renderPageTabs();
    renderSectionList();
    renderPropertiesPanel();
    switchMode(state.mode, false);
    renderSiteInfo();
    showScreen('editor');
  } catch (e) {
    console.error(e);
    toast('初期化エラー: ' + e.message, true);
  } finally { hideLoader(); }
}

// ============================================================
// モード切替
// ============================================================
function switchMode(mode, save = true) {
  if (save && state.isDirty) {
    if (!confirm('保存されていない変更があります。モードを切り替えますか？')) return;
  }
  state.mode = mode;
  document.querySelectorAll('#mode-tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'manual') {
    $('manual-mode-container').style.display = 'flex';
    $('gui-mode-container').style.display = 'none';
    $('html-editor').value = state.html;
    $('preview-frame').srcdoc = state.html;
  } else {
    $('manual-mode-container').style.display = 'none';
    $('gui-mode-container').style.display = 'flex';
    renderPageTabs();
    renderSectionList();
    renderPropertiesPanel();
  }
}

// ============================================================
// イベント登録
// ============================================================
$('mode-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (btn) switchMode(btn.dataset.mode);
});

// ページタブ
$('page-tabs').addEventListener('click', (e) => {
  const delBtn = e.target.closest('[data-del-page]');
  if (delBtn) {
    e.stopPropagation();
    const id = delBtn.dataset.delPage;
    if (state.pages.length <= 1) { toast('最後のページは削除できません', true); return; }
    if (!confirm('このページを削除しますか？')) return;
    state.pages = state.pages.filter(p => p.id !== id);
    if (state.currentPageId === id) state.currentPageId = state.pages[0].id;
    state.selectedSectionId = null;
    scheduleSave();
    renderPageTabs(); renderSectionList(); renderPropertiesPanel();
    return;
  }
  const tab = e.target.closest('[data-page-id]');
  if (tab) {
    state.currentPageId = tab.dataset.pageId;
    state.selectedSectionId = null;
    renderPageTabs(); renderSectionList(); renderPropertiesPanel();
    return;
  }
  if (e.target.id === 'add-page-btn') {
    const name = prompt('新しいページ名を入力してください:', '新しいページ');
    if (!name) return;
    const id = 'p' + Math.random().toString(36).slice(2, 8);
    state.pages.push({ id, name, sections: [] });
    state.currentPageId = id;
    state.selectedSectionId = null;
    scheduleSave();
    renderPageTabs(); renderSectionList(); renderPropertiesPanel();
  }
});

// セクションリスト
$('section-list').addEventListener('click', (e) => {
  const upBtn = e.target.closest('[data-move-up]');
  const downBtn = e.target.closest('[data-move-down]');
  const delBtn = e.target.closest('[data-delete]');
  const page = state.pages.find(p => p.id === state.currentPageId);

  if (upBtn && page) {
    e.stopPropagation();
    const idx = page.sections.findIndex(s => s.id === upBtn.dataset.moveUp);
    if (idx > 0) {
      [page.sections[idx - 1], page.sections[idx]] = [page.sections[idx], page.sections[idx - 1]];
      scheduleSave(); renderSectionList();
    }
    return;
  }
  if (downBtn && page) {
    e.stopPropagation();
    const idx = page.sections.findIndex(s => s.id === downBtn.dataset.moveDown);
    if (idx >= 0 && idx < page.sections.length - 1) {
      [page.sections[idx + 1], page.sections[idx]] = [page.sections[idx], page.sections[idx + 1]];
      scheduleSave(); renderSectionList();
    }
    return;
  }
  if (delBtn && page) {
    e.stopPropagation();
    if (!confirm('このセクションを削除しますか？')) return;
    page.sections = page.sections.filter(s => s.id !== delBtn.dataset.delete);
    if (state.selectedSectionId === delBtn.dataset.delete) state.selectedSectionId = null;
    scheduleSave(); renderSectionList(); renderPropertiesPanel();
    return;
  }
  const block = e.target.closest('[data-section-id]');
  if (block) {
    state.selectedSectionId = block.dataset.sectionId;
    renderSectionList();
    renderPropertiesPanel();
  }
});

// セクションパレット
document.querySelector('.section-palette').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-add]');
  if (btn) addSection(btn.dataset.add);
});

// スラッグ
$('slug-input').addEventListener('input', (e) => {
  state.slug = e.target.value;
  const err = validateSlugLocal(state.slug);
  e.target.classList.toggle('valid', !err);
  e.target.classList.toggle('invalid', !!err);
  scheduleSave();
});
function validateSlugLocal(slug) {
  if (!slug) return 'ページ名を入力してください';
  if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(slug)) return '英小文字・数字・-_ のみ、先頭は英数字、最大64文字';
  const reserved = ['cpmcarshop.github.io', 'makerpage', 'admin', 'api', 'www', 'assets', 'icons'];
  if (reserved.includes(slug)) return 'このページ名は使用できません';
  return null;
}
$('slug-check-btn').addEventListener('click', async () => {
  const err = validateSlugLocal(state.slug);
  if (err) { toast(err, true); return; }
  try {
    showLoader();
    const r = await api('checkPageName', { slug: state.slug });
    toast(r.available ? '✓ このページ名は使えます' : r.reason, !r.available);
  } catch (e) { toast(e.message, true); }
  finally { hideLoader(); }
});

// テーマ選択
$('theme-btn').addEventListener('click', () => {
  const grid = $('theme-grid');
  grid.innerHTML = Object.entries(THEMES).map(([id, t]) => `
    <div class="theme-card ${id === state.themeId ? 'selected' : ''}" data-theme-id="${id}">
      <div class="theme-thumb" style="background:${t.thumbBg};color:${t.thumbColor};">Aa</div>
      <div class="theme-meta"><strong>${t.name}</strong><span>${t.desc}</span></div>
    </div>
  `).join('');
  $('theme-modal').classList.add('active');
});
$('theme-grid').addEventListener('click', (e) => {
  const card = e.target.closest('[data-theme-id]');
  if (!card) return;
  const id = card.dataset.themeId;
  if (!confirm('テーマを変更すると、現在のページ構成が置き換わります。よろしいですか？')) return;
  state.themeId = id;
  state.pages = THEMES[id].defaultPages();
  state.currentPageId = state.pages[0].id;
  state.selectedSectionId = null;
  scheduleSave();
  renderPageTabs(); renderSectionList(); renderPropertiesPanel();
  $('theme-modal').classList.remove('active');
  toast('テーマを「' + THEMES[id].name + '」に変更しました');
});
$('theme-modal-close').addEventListener('click', () => $('theme-modal').classList.remove('active'));

// プレビュー
$('preview-btn').addEventListener('click', async () => {
  let html;
  if (state.mode === 'gui') {
    showLoader();
    try { await uploadGuiImages(); } catch (e) {}
    hideLoader();
    html = generateSiteHtml();
  } else {
    html = state.html;
  }
  $('preview-iframe').srcdoc = html;
  $('preview-modal').classList.add('active');
});
$('preview-modal-close').addEventListener('click', () => $('preview-modal').classList.remove('active'));

// ============================================================
// 公開
// ============================================================
async function uploadGuiImages() {
  const upload = async (src) => {
    if (!src || !src.startsWith('data:')) return src;
    const ext = (src.match(/^data:image\/([a-z]+);/) || [,'png'])[1];
    const filename = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,6) + '.' + (ext === 'jpeg' ? 'jpg' : ext);
    const res = await api('uploadSiteImage', { slug: state.slug, filename, dataUrl: src });
    return res.absoluteUrl;
  };

  for (const page of state.pages) {
    for (const sec of page.sections) {
      if (sec.type === 'image' && sec.props.src) {
        sec.props.src = await upload(sec.props.src);
      }
      if (sec.type === 'hero' && sec.props.bgImage) {
        sec.props.bgImage = await upload(sec.props.bgImage);
      }
      if (sec.type === 'gallery' && sec.props.images) {
        sec.props.images = await Promise.all(sec.props.images.map(upload));
      }
    }
  }
}

$('publish-btn').addEventListener('click', async () => {
  const slugErr = validateSlugLocal(state.slug);
  if (slugErr) { toast(slugErr, true); return; }

  let html;
  if (state.mode === 'gui') {
    if (state.pages.every(p => p.sections.length === 0)) { toast('セクションがありません', true); return; }
    showLoader();
    try { await uploadGuiImages(); }
    catch (e) { hideLoader(); toast('画像アップロード失敗: ' + e.message, true); return; }
    hideLoader();
    html = generateSiteHtml();
  } else {
    if (!state.html.trim()) { toast('HTMLが空です', true); return; }
    html = state.html;
  }

  if (!confirm(`ページ名「${state.slug}」で公開します。\nURL: https://cpmcarshop.github.io/${state.slug}/\n\n初回は1〜3分かかります。よろしいですか？`)) return;

  try {
    showLoader();
    await api('publishMakerSite', { slug: state.slug, html, mode: state.mode });
    clearDraft();
    state.isDirty = false;
    toast('✓ 公開しました（反映まで1〜3分）');
    try { state.site = await api('getMySite'); renderSiteInfo(); $('slug-input').disabled = true; } catch (e) {}
  } catch (e) { toast('公開失敗: ' + e.message, true); }
  finally { hideLoader(); }
});

// 削除
$('delete-btn').addEventListener('click', async () => {
  if (!state.site || !state.site.hasSite) return;
  const slug = state.site.slug;
  const input = prompt(`サイト「${slug}」を削除します。取り消せません。\n続行するにはページ名「${slug}」を入力：`);
  if (input !== slug) { if (input !== null) toast('ページ名が一致しません', true); return; }
  try {
    showLoader();
    await api('deleteMakerSite');
    toast('サイトを削除しました');
    state.site = { hasSite: false }; state.slug = '';
    state.pages = THEMES.racing.defaultPages();
    state.currentPageId = state.pages[0].id;
    state.themeId = 'racing';
    $('slug-input').value = ''; $('slug-input').disabled = false;
    $('delete-btn').style.display = 'none'; $('site-info-bar').style.display = 'none';
    clearDraft();
    renderPageTabs(); renderSectionList(); renderPropertiesPanel();
  } catch (e) { toast('削除失敗: ' + e.message, true); }
  finally { hideLoader(); }
});

// 認証
onAuthStateChanged(auth, async (user) => {
  state.user = user;
  if (user) await initAfterLogin(user);
  else showScreen('login');
});
$('login-google').addEventListener('click', async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch (e) { if (e.code !== 'auth/popup-closed-by-user') toast('ログイン失敗: ' + e.message, true); }
});
$('logout-from-notmaker')?.addEventListener('click', () => signOut(auth));
$('logout-btn').addEventListener('click', async () => {
  if (state.isDirty && !confirm('保存されていない変更があります。ログアウトしますか？')) return;
  await signOut(auth);
});
$('retry-maker-check')?.addEventListener('click', () => { if (state.user) initAfterLogin(state.user); });

window.addEventListener('beforeunload', (e) => {
  if (state.isDirty) { e.preventDefault(); e.returnValue = ''; }
});
</script>
